[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/retarget"
homepage = "https://github.com/ynishi/retarget"
documentation = "https://docs.rs/retarget"
readme = "README.md"

[workspace.dependencies]
retarget-core = { path = "crates/retarget-core", version = "0.1.0" }
arch-lint = "0.11"
